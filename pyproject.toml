[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "hody-telepro"
version = "1.0.0"
description = "Asynchronous Python toolkit for authorized Telegram entity inspection, caching, plugins, and structured exports."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Hody", email = "hody@example.com"}
]
keywords = ["telegram", "metadata", "extraction", "lookup", "async", "enterprise", "uv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.19.0",
    "pyrogram>=2.0.0",
    "tgcrypto>=1.2.5",
    "msgspec>=0.18.0",
    "diskcache>=5.6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "aiohttp>=3.8.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
full = [
    "pandas>=2.0.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
]

[project.urls]
Homepage = "https://github.com/f8c1/hody-telepro"
Repository = "https://github.com/f8c1/hody-telepro"
Issues = "https://github.com/f8c1/hody-telepro/issues"

[project.scripts]
hody-telepro = "hody_telepro.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hody_telepro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
allow_untyped_globals = true
