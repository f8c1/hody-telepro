name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && PIP_DEFAULT_TIMEOUT=120 PIP_RETRIES=10 python -m pip install --break-system-packages --retries 10 --timeout 120 --index-url https://pypi.org/simple -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Run Ruff
        if: matrix.python-version == '3.12'
        run: ruff check src tests

      - name: Run Mypy
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: mypy src/hody_telepro
